name: plates-cloud

# Deploys the plate render service to Modal. It needs two repository secrets:
#   MODAL_TOKEN_ID, MODAL_TOKEN_SECRET  (Settings > Secrets and variables > Actions)
# Target: the Modal workspace those tokens belong to, environment "main", app "forgedsa-plates".
# A push whose commit message contains [probe] is a dry run: it only reports whether the secrets are
# there and deploys nothing. The result of each run is written to the plates-cloud-status branch
# (no secret values in it).

on:
  push:
    branches: [plates-cloud]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plates-cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main
      DRY_RUN: ${{ contains(github.event.head_commit.message, '[probe]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the Modal client
        run: pip install --quiet "modal==1.6.3"
      - name: Probe
        run: |
          mkdir -p status
          {
            echo "run: ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            echo "commit: ${GITHUB_SHA}"
            echo "time: $(date -u +%FT%TZ)"
            echo "dry_run: ${DRY_RUN}"
            echo "target: modal environment ${MODAL_ENVIRONMENT}, app forgedsa-plates"
            if [ -n "${MODAL_TOKEN_ID}" ]; then echo "MODAL_TOKEN_ID: present"; else echo "MODAL_TOKEN_ID: missing"; fi
            if [ -n "${MODAL_TOKEN_SECRET}" ]; then echo "MODAL_TOKEN_SECRET: present"; else echo "MODAL_TOKEN_SECRET: missing"; fi
          } > status/probe.txt
          # Shape only (never the value): a Modal token id is "ak-" + 22 characters, a secret "as-" + 22.
          python - >> status/probe.txt <<'PY'
          import os
          for name, prefix in (("MODAL_TOKEN_ID", "ak-"), ("MODAL_TOKEN_SECRET", "as-")):
              raw = os.environ.get(name, "")
              v = raw.strip()
              print(f"{name} shape: length {len(raw)} (trimmed {len(v)}, expected 25), "
                    f"starts with {prefix}: {v.startswith(prefix)}, "
                    f"spaces or line breaks inside: {any(c.isspace() for c in v)}")
          PY
          cat status/probe.txt
      - name: Deploy to Modal (environment main)
        if: env.DRY_RUN != 'true' && env.MODAL_TOKEN_ID != '' && env.MODAL_TOKEN_SECRET != ''
        run: |
          # A pasted secret can carry more than the token (a trailing "--profile=..." from the command
          # line, a space, a line break). Keep the first word only, and mask it: GitHub masks the value
          # as stored, not this shorter part of it.
          MODAL_TOKEN_ID="$(printf %s "${MODAL_TOKEN_ID}" | awk '{print $1; exit}')"
          MODAL_TOKEN_SECRET="$(printf %s "${MODAL_TOKEN_SECRET}" | awk '{print $1; exit}')"
          echo "::add-mask::${MODAL_TOKEN_ID}"
          echo "::add-mask::${MODAL_TOKEN_SECRET}"
          export MODAL_TOKEN_ID MODAL_TOKEN_SECRET
          PLATES_API_TOKEN="$(python -c "import hashlib,os;print(hashlib.sha256((os.environ['MODAL_TOKEN_SECRET']+':forgedsa-plates-api').encode()).hexdigest())")"
          echo "::add-mask::${PLATES_API_TOKEN}"
          export PLATES_API_TOKEN
          set +e
          PLATES_GPUS="t4,l4,l40s" modal deploy --env "${MODAL_ENVIRONMENT}" scripts/plates/cloud/app.py > status/deploy.txt 2>&1
          code=$?
          mode="gpu+cpu"
          if [ "${code}" != "0" ] && grep -qi "payment method" status/deploy.txt; then
            # Modal wants a card on the account before it will create GPU functions. Deploy the CPU
            # worker alone for now; re-run this workflow after a payment method is added.
            mv status/deploy.txt status/deploy_gpu_refused.txt
            PLATES_GPUS="" modal deploy --env "${MODAL_ENVIRONMENT}" scripts/plates/cloud/app.py > status/deploy.txt 2>&1
            code=$?
            mode="cpu only (GPU refused: no payment method on the Modal account)"
          fi
          echo "mode: ${mode}" >> status/deploy.txt
          echo "exit: ${code}" >> status/deploy.txt
          set -e
          [ -f status/deploy_gpu_refused.txt ] && sed -i -E 's/a[ks]-[A-Za-z0-9]{10,}/[redacted]/g' status/deploy_gpu_refused.txt
          # The status branch is public: strip anything shaped like a Modal token before it is published.
          sed -i -E 's/a[ks]-[A-Za-z0-9]{10,}/[redacted]/g' status/deploy.txt
          tail -40 status/deploy.txt
      - name: Publish the status
        if: always()
        run: |
          git config user.name "plates-bot"
          git config user.email "plates-bot@users.noreply.github.com"
          cp -r status /tmp/status
          git checkout --orphan plates-cloud-status
          git rm -rf --cached . > /dev/null 2>&1 || true
          git clean -fdx > /dev/null 2>&1 || true
          cp -r /tmp/status/. .
          git add -A
          git commit -m "status for ${GITHUB_SHA}"
          git push origin +plates-cloud-status
